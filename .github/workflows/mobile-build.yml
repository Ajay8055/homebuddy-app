name: HomeBuddy native builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'vite.config.js'
      - '.github/workflows/mobile-build.yml'

permissions:
  contents: read

jobs:
  android:
    name: Build native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies and build web assets
        run: |
          npm install
          npm run build
          npm install --no-save typescript
      - name: Generate a clean Capacitor Android project
        run: |
          # The committed android/ directory is the legacy Trusted Web Activity.
          # Generate the real Capacitor project in CI without modifying that source directory.
          rm -rf android
          npx cap add android
          npx cap sync android
      - name: Add Android microphone permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''<uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />'''
          if "android.permission.RECORD_AUDIO" not in s:
              s = s.replace(marker, marker + "\\n    " + permissions, 1)
          p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HomeBuddy-Native-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: Build iOS Simulator app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and build web app
        run: |
          npm install
          npm run build
          npm install --no-save typescript
      - name: Generate iOS project and sync
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Build unsigned iOS Simulator app
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \\
            -scheme App \\
            -sdk iphonesimulator \\
            -configuration Debug \\
            -derivedDataPath build/ios \\
            CODE_SIGNING_ALLOWED=NO build
          cd build/ios/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent App.app HomeBuddy-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HomeBuddy-iOS-Simulator-App
          path: build/ios/Build/Products/Debug-iphonesimulator/HomeBuddy-iOS-Simulator.zip
          if-no-files-found: error
