name: HomeBuddy quality checks
on:
  push:
    branches: [main, feature/homebuddy-conversational-ai]
  pull_request:
    branches: [main, feature/native-android-expo]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
