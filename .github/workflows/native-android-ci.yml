name: Native Android CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/native-android-ci.yml'
  push:
    branches: [main, feature/homebuddy-conversational-ai]
    paths:
      - 'mobile/**'
      - '.github/workflows/native-android-ci.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install
      - name: Generate native Android project
        run: CI=1 npx expo prebuild --platform android
      - name: Bundle native JavaScript for Android
        run: npx expo export --platform android --output-dir dist-android
      - name: Configure Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --stacktrace assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: homebuddy-native-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Emulator install and launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb wait-for-device
            adb install -r mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.homebuddy.app 1
            sleep 5
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q com.homebuddy.app
