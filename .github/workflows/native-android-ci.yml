name: Native Android CI
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/native-android-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/native-android-ci.yml'
  workflow_dispatch:
jobs:
  android-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install
      - name: Generate native Android project
        run: CI=1 npx expo prebuild --platform android
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Emulator install and launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            adb install -r mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.homebuddy.app 1
            sleep 10
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q com.homebuddy.app
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: homebuddy-native-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
